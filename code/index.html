<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Code Playground</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --text: #ffffff;
            --border: #333;
            --header: #252526;
            --accent: #007acc;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: var(--header);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-side, .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-side {
            border-right: 1px solid var(--border);
        }

        .pane-label {
            background: var(--header);
            padding: 5px 15px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        textarea {
            flex: 1;
            background: #1a1a1a;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        iframe {
            flex: 1;
            background: white;
            border: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.1);
        }

        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .editor-side { border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <strong>MiniPen</strong>
        <button onclick="runCode()">Run Code</button>
    </header>
    
    <div class="main">
        <div class="editor-side">
            <div class="pane-label">HTML / CSS / JS</div>
            <textarea id="code" spellcheck="false" placeholder="Write your HTML here..."><!-- Add some CSS -->
<style>
  body { font-family: sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
  h1 { color: #ff3e00; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
</style>

<!-- Add some HTML -->
<h1>Hello, World!</h1>

<!-- Add some JS -->
<script>
  console.log("Playground is ready!");
</script></textarea>
        </div>
        
        <div class="preview-side">
            <div class="pane-label">Preview</div>
            <iframe id="preview"></iframe>
        </div>
    </div>
</div>

<script>
    function runCode() {
        const code = document.getElementById('code').value;
        const preview = document.getElementById('preview').contentWindow.document;
        
        preview.open();
        preview.write(code);
        preview.close();
    }

    // Auto-run on load
    window.onload = runCode;

    // Optional: Hotkey (Ctrl+S or Cmd+S to run)
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            runCode();
        }
    });
</script>

</body>
</html>
