<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plain Text Sports - Kato Sports Network</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LZD9DR8ZX5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LZD9DR8ZX5');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 12px;
            line-height: 1.2;
        }
        header {
            border-bottom: 1px solid #000;
            padding-bottom: 4px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.1rem;
            margin: 0 0 2px 0;
            text-transform: uppercase;
        }
        .nav-links {
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .nav-links a {
            color: #000;
            margin-right: 10px;
            text-decoration: underline;
        }
        .date-header {
            font-weight: bold;
            margin: 6px 0 8px 0;
            border-bottom: 1px dashed #000;
            display: inline-block;
            font-size: 0.85rem;
        }
        .section-heading {
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 14px;
            margin-bottom: 8px;
            border-bottom: 1px solid #000;
            font-size: 0.9rem;
        }
        .sport-group {
            margin-bottom: 12px;
        }
        .sport-title {
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #222;
        }
        .league-section {
            margin-bottom: 10px;
            margin-left: 4px;
        }
        .league-title {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            max-width: 650px;
        }
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
        .game-box {
            border: 1px solid #000;
            padding: 4px 8px;
            background-color: #f9f9f9;
            box-sizing: border-box;
        }
        .game-row {
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading {
            color: #666;
            font-style: italic;
            font-size: 0.82rem;
        }
        .inactive-list {
            margin-top: 4px;
            font-size: 0.82rem;
            margin-left: 4px;
        }
        .inactive-item {
            margin-bottom: 2px;
            color: #444;
        }
    </style>
</head>
<body>

    <header>
        <h1>Plain Text Sports</h1>
        <div class="nav-links">
            <a href="https://kscmn.com">KSC Home</a>
            <a href="#active-container">Active Today</a>
            <a href="#inactive-container">No Games Today</a>
        </div>
    </header>

    <main>
        <div class="date-header" id="current-date">Loading date...</div>
        
        <div class="section-heading">Leagues with Games Today</div>
        <div id="active-container">
            <div class="loading" id="global-loading">Checking schedules...</div>
        </div>

        <div class="section-heading">Leagues with No Games Today</div>
        <div class="inactive-list" id="inactive-container">
            <div class="loading">Checking schedule status...</div>
        </div>
    </main>

    <script>
        // Execute date header assignment immediately to prevent blank status
        try {
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
        } catch (e) {
            console.error("Date formatting error:", e);
        }

        const targetLeagues = [
            { sportName: 'Baseball', sportKey: 'baseball', leagueKey: 'mlb', name: 'MLB' },
            { sportName: 'Basketball', sportKey: 'basketball', leagueKey: 'nba', name: 'NBA' },
            { sportName: 'Football', sportKey: 'football', leagueKey: 'nfl', name: 'NFL' },
            { sportName: 'Football', sportKey: 'football', leagueKey: 'college-football', name: 'College Football' },
            { sportName: 'Hockey', sportKey: 'hockey', leagueKey: 'nhl', name: 'NHL' }
        ];

        async function fetchLeagueData(item) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout limit per fetch

            try {
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${item.sportKey}/${item.leagueKey}/scoreboard`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                
                return {
                    ...item,
                    hasGames: data && data.events && data.events.length > 0,
                    events: data.events || []
                };
            } catch (error) {
                clearTimeout(timeoutId);
                console.warn(`Could not load ${item.name}:`, error);
                return { ...item, hasGames: false, events: [], error: true };
            }
        }

        async function initDashboard() {
            const activeContainer = document.getElementById('active-container');
            const inactiveContainer = document.getElementById('inactive-container');

            // Fetch all leagues concurrently
            const results = await Promise.all(targetLeagues.map(item => fetchLeagueData(item)));

            activeContainer.innerHTML = '';
            inactiveContainer.innerHTML = '';

            let activeLeaguesBySport = {};
            let inactiveList = [];

            results.forEach(item => {
                if (item.hasGames) {
                    if (!activeLeaguesBySport[item.sportName]) {
                        activeLeaguesBySport[item.sportName] = [];
                    }
                    activeLeaguesBySport[item.sportName].push(item);
                } else {
                    inactiveList.push(item.name);
                }
            });

            const sortedSports = Object.keys(activeLeaguesBySport).sort();

            if (sortedSports.length === 0) {
                activeContainer.innerHTML = '<div class="game-row">No games scheduled across these leagues today.</div>';
            } else {
                sortedSports.forEach(sportName => {
                    const sportGroup = document.createElement('div');
                    sportGroup.className = 'sport-group';

                    const sportTitle = document.createElement('div');
                    sportTitle.className = 'sport-title';
                    sportTitle.textContent = sportName;
                    sportGroup.appendChild(sportTitle);

                    const sortedLeagues = activeLeaguesBySport[sportName].sort((a, b) => a.name.localeCompare(b.name));

                    sortedLeagues.forEach(league => {
                        const leagueSection = document.createElement('div');
                        leagueSection.className = 'league-section';

                        const title = document.createElement('div');
                        title.className = 'league-title';
                        title.textContent = league.name;
                        leagueSection.appendChild(title);

                        const grid = document.createElement('div');
                        grid.className = 'games-grid';

                        league.events.forEach(event => {
                            const competition = event.competitions[0];
                            const status = event.status.type.detail;
                            const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
                            const awayTeam = competition.competitors.find(c => c.homeAway === 'away');
                            
                            const box = document.createElement('div');
                            box.className = 'game-box';

                            const row = document.createElement('div');
                            row.className = 'game-row';
                            row.textContent = `${awayTeam.team.abbreviation} ${awayTeam.score || '0'} @ ${homeTeam.team.abbreviation} ${homeTeam.score || '0'} - ${status}`;
                            
                            box.appendChild(row);
                            grid.appendChild(box);
                        });

                        leagueSection.appendChild(grid);
                        sportGroup.appendChild(leagueSection);
                    });

                    activeContainer.appendChild(sportGroup);
                });
            }

            if (inactiveList.length === 0) {
                inactiveContainer.innerHTML = '<div class="inactive-item">None</div>';
            } else {
                inactiveList.sort().forEach(itemText => {
                    const inactiveRow = document.createElement('div');
                    inactiveRow.className = 'inactive-item';
                    inactiveRow.textContent = `- ${itemText}`;
                    inactiveContainer.appendChild(inactiveRow);
                });
            }
        }

        // Initialize script after DOM parsing complete
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDashboard);
        } else {
            initDashboard();
        }
    </script>
</body>
</html>
