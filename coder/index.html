<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coder · Zacito</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #202428;
    }

    body {
      overflow: hidden;
    }

    .brandbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #dfe2e4;
      background: #ffffff;
    }

    .brandbar .brand {
      color: #202428;
      font-size: 1.15rem;
      font-weight: 750;
      letter-spacing: -0.04em;
      text-decoration: none;
    }

    .brandbar .home {
      color: #6d7378;
      font-size: .85rem;
      text-decoration: none;
    }

    .brandbar .home:hover {
      color: #202428;
      text-decoration: underline;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 45px);
    }

    .editor-side {
      display: grid;
      grid-template-rows: 1fr 1fr;
      min-width: 0;
      border-right: 1px solid #dfe2e4;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: white;
    }

    .panel:first-child {
      border-bottom: 1px solid #dfe2e4;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 12px;
      border-bottom: 1px solid #dfe2e4;
      background: #f5f6f7;
      font-size: 13px;
      font-weight: 600;
    }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 0;
      resize: none;
      border: 0;
      outline: 0;
      padding: 14px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5;
      background: #fff;
      color: #202428;
      tab-size: 2;
    }

    .preview-side {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: white;
    }

    .preview-header {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #dfe2e4;
      background: #f5f6f7;
      font-size: 13px;
      font-weight: 600;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 600px 600px;
        height: auto;
      }

      .editor-side {
        border-right: 0;
        border-bottom: 1px solid #dfe2e4;
      }
    }
  </style>
<!-- seo:start -->
  <meta name="description" content="Zacito's browser code playground — write HTML, CSS, and JavaScript and see the result live.">
  <link rel="canonical" href="https://zacito.github.io/coder/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Coder · Zacito">
  <meta property="og:description" content="Zacito's browser code playground — write HTML, CSS, and JavaScript and see the result live.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zacito.github.io/coder/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Coder · Zacito">
  <meta name="twitter:description" content="Zacito's browser code playground — write HTML, CSS, and JavaScript and see the result live.">
  <!-- seo:end -->
</head>

<body>

  <header class="brandbar">
    <a class="brand" href="/">Zacito</a>
    <a class="home" href="/">← Home</a>
  </header>

  <div class="app">

    <div class="editor-side">

      <section class="panel">
        <div class="panel-header">
          <span>HTML</span>
        </div>

        <textarea id="htmlEditor" spellcheck="false"><div class="card">
  <h1>Hello World</h1>
  <p>Edit the HTML or CSS to see the preview update.</p>
  <button>Click Me</button>
</div></textarea>
      </section>

      <section class="panel">
        <div class="panel-header">
          <span>CSS</span>
        </div>

        <textarea id="cssEditor" spellcheck="false">body {
  font-family: Arial, sans-serif;
  padding: 40px;
  background: #f4f4f4;
}

.card {
  max-width: 400px;
  padding: 30px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
}

h1 {
  margin-top: 0;
}

button {
  padding: 10px 16px;
  border: 0;
  background: #222;
  color: white;
  border-radius: 4px;
  cursor: pointer;
}</textarea>
      </section>

    </div>

    <div class="preview-side">

      <div class="preview-header">
        Preview
      </div>

      <iframe
        id="preview"
        title="Live Preview"
        sandbox="allow-scripts"
      ></iframe>

    </div>

  </div>

  <script>
    const htmlEditor = document.getElementById("htmlEditor");
    const cssEditor = document.getElementById("cssEditor");
    const preview = document.getElementById("preview");

    let updateTimer;

    function updatePreview() {
      const html = htmlEditor.value;
      const css = cssEditor.value;

      const documentContent = `
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <style>
              ${css}
            </style>
          </head>

          <body>
            ${html}
          </body>
        </html>
      `;

      preview.srcdoc = documentContent;
    }

    function scheduleUpdate() {
      clearTimeout(updateTimer);

      updateTimer = setTimeout(() => {
        updatePreview();
      }, 150);
    }

    htmlEditor.addEventListener("input", scheduleUpdate);
    cssEditor.addEventListener("input", scheduleUpdate);

    // Allow Tab key inside editors
    function enableTab(textarea) {
      textarea.addEventListener("keydown", function(event) {
        if (event.key === "Tab") {
          event.preventDefault();

          const start = this.selectionStart;
          const end = this.selectionEnd;

          this.value =
            this.value.substring(0, start) +
            "  " +
            this.value.substring(end);

          this.selectionStart =
            this.selectionEnd =
            start + 2;

          scheduleUpdate();
        }
      });
    }

    enableTab(htmlEditor);
    enableTab(cssEditor);

    updatePreview();
  </script>

</body>
</html>
